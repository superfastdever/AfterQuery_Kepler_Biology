# Kepler task configuration.
#
# Field list and values follow the REQUIRED LAYOUT panel on the submit form,
# which is more specific than the general guidance in docs/kepler-instructions.md
# where the two differ.
#
# `artifacts` must stay above the first [section]. It lists the absolute paths
# harbor copies out of the agent's container for the verifier. Nothing else the
# agent wrote survives. Every path here must also be named in instruction.md,
# and its parent directory must be `mkdir -p`'d in tests/Dockerfile.
artifacts = ["/app/output.json"]

[task]
# Must be "afterquery/<slug>", where <slug> equals the directory name and the
# task name submitted on the platform: lowercase, at most 3 hyphen-separated
# words.
name = "afterquery/UNSET-slug"
# One line saying what the task asks for. Required.
description = ""

[metadata]
# --- author identity: all four are factual claims about the owner. ----------
# WRITTEN BY THE REPO OWNER, NOT BY AI.
author_name = ""
author_email = ""
author_organization = ""
author_profile = ""
# A formal declaration. Never generated, never guessed.
conflicts_of_interest = ""

# --- the three explanations reviewers read first ---------------------------
# Why this is hard for agents AND for humans. Name the specific failure mode
# the task targets: the invariant that gets broken, the race that is invisible,
# the rule that has to be inferred rather than read.
difficulty_explanation = ""
# High-level approach and the key insights a solver needs.
solution_explanation = ""
# How tests establish correctness, and why the result cannot be faked.
verification_explanation = ""

# --- classification --------------------------------------------------------
# category stays "Science" for this dataset.
category = "Science"
# Subdomain label within the Science category.
subcategory = "Biology"
#
# domain and field carry the SAME slugs the submit form has selected, plus a
# free-text subfield. This repo is approved for Life Sciences only.
domain = "TODO-domain-slug"       # Life Sciences
#
# The field is "the one the task's core computational work belongs to":
#   Ecology & Evolutionary Biology   phylogenetics, population genetics   FOCUS
#   Neuroscience & Cognitive Science neuroimaging, psychophysics, behavior FOCUS
#   Medicine & Health Sciences       clinical, epidemiology, public health occasionally
#   Biology & Biotechnology          bioimaging, genomics, synthetic bio   NEVER (owner policy)
field = "TODO-field-slug"
# Free text, as specific as you can make it.
subfield = ""                     # e.g. "population genetics"

tags = []                         # e.g. ["phylogenetics", "python"]
# Best-case hours for a focused domain expert. Be honest; it calibrates review.
expert_time_estimate_hours = 0
# WRITTEN BY THE REPO OWNER, NOT BY AI. Must describe actual professional
# background in this domain. Generic statements fail review.
relevant_experience = ""

[verifier]
# Raise this to comfortably exceed the test suite's runtime.
timeout_sec = 120.0
# The verifier runs in its own container, built from tests/Dockerfile, after
# the agent's container is torn down.
environment_mode = "separate"

[verifier.environment]
# The verifier is sealed: it grades artifacts and must not reach the network.
network_mode = "no-network"

[agent]
# Time the oracle run, then give the agent several times that. Ceiling is
# 28800; the guidance also asks for at least 9000 (2.5h). Do not leave this at
# the template value by accident.
timeout_sec = 9000.0

[environment]
# The agent keeps its full capabilities, network included. Blocking access is
# not a source of difficulty.
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1                          # 1 / 2 / 4 / 8 / 16 only
memory_mb = 2048                  # 1024 / 2048 / 4096 / 8192 / 16384 only
storage_mb = 10240                # max 40960
gpus = 0                          # stays 0 for Science/Biology tasks
# gpu_types = ["H100"]            # only for a GPU-option ML task
#
# Do NOT add an allow_internet key, with either value. network_mode above is
# how the policy is expressed.
